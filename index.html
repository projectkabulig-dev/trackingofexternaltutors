<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12284A">
<title>ARAL Gain Tracker · SDO Romblon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12284A; --ink2:#46587A; --paper:#F2F5F9; --card:#FFFFFF; --line:#D6DDE8;
  --sea:#0B7A86; --sea-d:#07555E; --sea-l:#E1F1F3; --sun:#F0B323; --sun-l:#FFF4D6; --coral:#D2473A; --coral-l:#FBE6E3; --leaf:#2D8A55; --leaf-l:#E1F3E8;
  --r:12px; --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --disp:'Fredoka','Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body.noscroll{overflow:hidden}
h1,h2{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.1px}
h2{font-size:22px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.sub{color:var(--ink2);margin:0;font-size:15px}.pad{padding:16px 4px}
.hint{color:var(--ink2);font-size:14px;margin:0}
.err{color:var(--coral);font-weight:700;margin:0;min-height:0}
.err:empty{display:none}
.warn{background:var(--sun-l);border-left:4px solid var(--sun);padding:10px 12px;border-radius:6px;margin:0;font-size:15px}
.warn.big{padding:14px 14px;font-size:15px}.warn.big p{margin:6px 0 0}.or{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px;margin-top:4px}.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.codebox{background:var(--sea-l);border:2px solid var(--sea);border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:4px}.codebox small{color:var(--sea-d);font-weight:700}.codebox strong{font-family:var(--disp);font-size:44px;letter-spacing:2px;color:var(--sea-d)}
.hdr-r{display:flex;align-items:center;gap:8px;flex:none}.help{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.glyph{display:inline-flex;vertical-align:middle;flex:none}.legend{width:100%;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;cursor:pointer;text-align:left;font-size:14px}.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{font-style:normal;color:var(--sea);font-weight:700;margin-left:auto}
details{border:1px solid var(--line);border-radius:var(--r);background:#fff}summary{min-height:48px;display:flex;align-items:center;padding:0 14px;font-weight:700;cursor:pointer}.hbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}.hbody p{margin:0}.hbody ol{margin:0;padding-left:20px}
.mrow{display:flex;gap:10px;align-items:flex-start}.mrow p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.loading{padding:40px;text-align:center;color:var(--ink2)}

/* buttons */
.btn{min-height:48px;padding:10px 16px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.danger{border-color:var(--coral);color:var(--coral)}
.btn.good{background:var(--leaf);border-color:var(--leaf);color:#fff;font-size:20px;flex:1}
.btn.bad{background:var(--card);border-color:var(--coral);color:var(--coral);font-size:20px;flex:1}
.btn.mic{border-style:dashed;border-color:var(--ink2);color:var(--ink2);font-weight:400;align-self:center}
.btn.wide{width:100%}
a.btn{text-decoration:none;color:var(--ink)}
.stack.tight{gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>.fld{min-width:0}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-weight:700;font-size:14px;color:var(--ink2)}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff}
textarea{min-height:140px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--sea);outline:none;box-shadow:0 0 0 3px var(--sea-l)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px}.chk input{width:22px;height:22px;accent-color:var(--sea)}
.seg{display:flex;background:#E6EBF2;border-radius:var(--r);padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;border-radius:9px;font-weight:700;color:var(--ink2);cursor:pointer;padding:6px 8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 rgba(18,40,74,.12)}

/* login */
.login{max-width:440px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.brand h1{font-size:30px;line-height:1.1}.brand p{margin:0;color:var(--ink2)}
.note{font-size:14px;color:var(--ink2);margin:0}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.who{display:flex;flex-direction:column;min-width:0}.who strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who span{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:rgba(255,255,255,.14);color:#fff}.pill.wait{background:var(--sun);color:var(--ink)}.pill.busy{background:var(--sea-l);color:var(--sea-d)}
.main{max-width:600px;margin:0 auto;padding:16px 16px 110px}
.stack{display:flex;flex-direction:column;gap:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 8px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;min-height:56px;border-top:3px solid transparent}
.tab.on{color:var(--sea);border-top-color:var(--sea)}

/* learners */
.sumline{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15px}.sumline span{color:var(--ink2)}
.tools{display:flex;gap:10px}.tools input{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.row{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sea);border-radius:var(--r);cursor:pointer}
.row.pull{border-left-color:var(--sun)}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--sea-l);color:var(--sea-d);display:grid;place-items:center;font-weight:700;font-family:var(--disp)}
.av.pull{background:var(--sun-l);color:#7A5600}
.rn{flex:1;min-width:0;display:flex;flex-direction:column}.rn strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rn small{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex:none}
.chip{font-style:normal;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink2)}
.chip.ok{background:var(--leaf-l);border-color:var(--leaf);color:var(--leaf)}.chip.bad{background:var(--coral-l);border-color:var(--coral);color:var(--coral)}
.empty{text-align:center;padding:32px 12px;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}.empty p{margin:0}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(18,40,74,.5)}
.sheet-box{position:relative;background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-box .x{position:absolute;right:10px;top:8px;width:44px;height:44px;border:0;background:transparent;font-size:30px;line-height:1;color:var(--ink2);cursor:pointer}
.sheet-box h2{padding-right:40px}
table.mini{width:100%;border-collapse:collapse;font-size:14px}.mini th,.mini td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.mini thead th{color:var(--ink2);font-size:13px}

/* tests */
#test{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto}
.tview{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.ttop{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--ink);color:#fff}
.ttop div{display:flex;flex-direction:column}.ttop small{opacity:.8}.ttop .btn.ghost{color:#fff}
.prog{height:6px;background:#DDE3EC}.prog i{display:block;height:100%;width:0;background:var(--sun);transition:width .25s}
.tbody{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:16px}.tbody.scroll{overflow:visible}
.cnt{color:var(--ink2);font-size:15px;font-weight:700}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.qt{font-family:var(--disp);font-size:34px;line-height:1.25;font-weight:500;word-break:break-word}
.q .qt:only-child{text-align:center}
.bigemo{font-size:30px;line-height:1.5;letter-spacing:2px;text-align:center}.bigemo.sm{font-size:20px;text-align:left}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-size:.78em;line-height:1.05}.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px 1px}.fr span:last-child{padding-top:1px}
.answer{min-height:64px;background:#fff;border:2px solid var(--sea);border-radius:var(--r);font-family:var(--disp);font-size:36px;text-align:center;padding:6px 10px;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:58px;border-radius:var(--r);border:1.5px solid var(--line);background:#fff;font-family:var(--disp);font-size:26px;cursor:pointer}.key:active{background:var(--sea-l)}.key.del{background:#EEF1F6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.sm{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{min-height:64px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font-family:var(--disp);font-size:24px;cursor:pointer;padding:8px}.opt.on{border-color:var(--sea);background:var(--sea-l)}
.tfoot{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.tfoot .btn{flex:1}
.plist{display:flex;flex-direction:column;gap:10px}.prow{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}.pn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}.pq{flex:1;display:flex;flex-direction:column;gap:8px;font-size:18px}
.score{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0}.score .big{font-family:var(--disp);font-size:56px;line-height:1.1}.score p{margin:0;color:var(--ink2)}
.star{color:var(--sun);font-size:54px;line-height:1}
.marks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.mk{min-width:44px;height:44px;padding:0 8px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid}.mk.good{border-color:var(--leaf);color:var(--leaf);background:var(--leaf-l)}.mk.bad{border-color:var(--coral);color:var(--coral);background:var(--coral-l);border-radius:22px}
.readtext{font-family:var(--disp);font-size:56px;text-align:center;padding:36px 8px;background:var(--card);border:1px solid var(--line);border-radius:16px;word-break:break-word;line-height:1.2}.readtext.long{font-size:30px;padding:28px 14px}
.passage{font-size:24px;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stepper{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}.stepper span{flex:1;font-size:15px;color:var(--ink2);font-weight:700}.stepper strong{min-width:34px;text-align:center;font-family:var(--disp);font-size:22px}.stepper .btn{min-width:48px;padding:0}
.micbox{text-align:center;min-height:20px;color:var(--ink2)}
.ladder{display:flex;flex-direction:column;gap:6px}.rung{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card)}.rung b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-family:var(--disp)}.rung span{flex:1;font-weight:700}.rung em{font-style:normal;font-size:14px;color:var(--ink2)}
.rung.good{border-color:var(--leaf);background:var(--leaf-l)}.rung.good b{background:var(--leaf);color:#fff}.rung.bad{border-color:var(--coral);background:var(--coral-l)}.rung.bad b{background:var(--coral);color:#fff}.rung.skip{opacity:.6}

/* today */
.srow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.srow.open{border-color:var(--sea)}
.shead{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:12px;text-align:left;cursor:pointer}
.spanel{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px;background:#F8FAFC;border-top:1px solid var(--line)}
.wstitle{padding:8px 12px;border-left:4px solid var(--sea);background:var(--sea-l);border-radius:8px;font-weight:700;color:var(--sea-d)}
.cnt{display:flex;justify-content:space-between;align-items:center}.timer{font-family:var(--disp);font-size:20px;color:var(--ink)}
.rgrid{display:grid;gap:10px}.rgrid.row{grid-template-columns:repeat(3,1fr)}.rgrid.col{grid-template-columns:1fr}
.rtile{position:relative;min-height:84px;border:2px solid var(--line);background:#fff;border-radius:16px;font-family:var(--disp);cursor:pointer;padding:10px;text-align:center;color:var(--ink)}
.rtile.sm{font-size:46px}.rtile.wide{font-size:30px;text-align:left;padding:14px 56px 14px 16px;line-height:1.2}
.rtile .tick{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--leaf);color:#fff;font-size:17px;display:none;place-items:center}
.rtile.on{border-color:var(--leaf);background:var(--leaf-l)}.rtile.on .tick{display:grid}.rtile.sug{border-style:dashed;border-color:var(--sea)}
.rtile .ans{display:block;font-family:var(--body);font-size:14px;color:var(--ink2);margin-top:4px}
.passage.small{font-size:17px;line-height:1.55;padding:12px}
.glist{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}.grow{display:grid;grid-template-columns:1fr minmax(150px,200px);gap:6px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.grow.perfect{border-color:var(--sun);background:var(--sun-l)}.grow.redo{border-color:var(--coral);background:var(--coral-l)}.grow.absent{background:#EEF1F6}.gnums{grid-column:1/-1;display:flex;gap:10px}.gnum{display:flex;align-items:center;gap:6px;font-weight:700}.gnum input{width:72px;min-height:40px}
.startbox{border-left:4px solid var(--sea);background:var(--sea-l);border-radius:10px;padding:10px 14px;margin:8px 0}.startbox ol{margin:6px 0 0 18px;padding:0}.startbox li{margin:3px 0}
.tries{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink2)}.tries ul{margin:6px 0 0 18px;padding:0}.tries strong{color:var(--ink)}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--ink2)}.sym{font-weight:700;font-size:18px;line-height:1}.sym.star{color:var(--sun)}.sym.tri{color:var(--ink)}.sym.circ{color:var(--coral)}.sym.ci{font-size:12px;background:var(--sea-l);border-radius:8px;padding:3px 7px;color:var(--sea-d)}.grow.help{border-color:var(--ink)}.grow.notyet{border-color:var(--coral);background:var(--coral-l)}
.lasbox{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:6px}.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row2 input{min-height:44px;width:100%}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row3 input{min-height:44px;width:100%}
.login.mon{max-width:1100px}.montop{display:flex;align-items:center;gap:10px}.montop h2{margin:0}.mchips{display:flex;flex-wrap:wrap;gap:8px}.mchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--ink)}.mchip.on{border-color:var(--sea);background:var(--sea-l)}.monfilters{display:grid;grid-template-columns:1fr;gap:8px}.mst{padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px}.mst.active{background:var(--leaf-l);color:var(--leaf)}.mst.quiet{background:var(--coral-l);color:var(--coral)}.mst.notstarted{background:var(--sun-l);color:#7a5200}.mst.nolearners{background:#EEF1F6;color:var(--ink2)}.monTable{min-width:760px}.monTable th:first-child,.monTable td:nth-child(2){text-align:left}
@media (min-width:900px){.monfilters{grid-template-columns:200px 1fr 220px}}
.stat{padding:10px 12px;border-radius:10px;font-weight:700;text-align:center}.stat.perfect{background:var(--sun-l);color:#7A5600}.stat.redo{background:var(--coral-l);color:var(--coral)}

/* report */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}.stat-card small{color:var(--ink2);font-weight:700}.stat-card strong{font-family:var(--disp);font-size:26px;line-height:1.15}.stat-card span{font-size:13px;color:var(--ink2)}
.scrollx{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table.rep{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}.rep th,.rep td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.rep th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}.rep thead th{font-size:12px;color:var(--ink2);text-align:right}.rep thead th:first-child{text-align:left}
.rep td.up{color:var(--leaf);font-weight:700}.rep td.down{color:var(--coral);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.kv span{color:var(--ink2)}.kv strong{text-align:right;word-break:break-word}

#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;max-width:88vw;z-index:80;opacity:0;pointer-events:none;transition:.2s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#printRoot{display:none}

@media print{
  body.printing-test>*:not(#printRoot){display:none!important}
  body.printing-test #printRoot{display:block!important;padding:0;color:#000;background:#fff}
  body.printing-test{background:#fff}
  .pitems{padding-left:22px;font-size:18px}.pitems li{margin-bottom:18px;break-inside:avoid}.pline{margin-top:6px}
  #printRoot table{border-collapse:collapse;width:100%;font-size:11px}#printRoot th,#printRoot td{border:1px solid #888;padding:4px 6px;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.main{padding-top:24px}.qt{font-size:40px}}
input.answer{border:2px solid var(--sea);font-family:var(--disp);font-size:36px;text-align:center;min-height:64px;padding:6px 10px}input.answer[readonly]{cursor:default}
.hint.center{text-align:center}
